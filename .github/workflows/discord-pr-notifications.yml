name: Discord PR Notifications

on:
  pull_request:
    types: [opened, synchronize, closed, reopened]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    if: github.event.pull_request || (github.event.issue.pull_request && github.event_name == 'issue_comment')

    steps:
      # Titles, bodies, comments and branch names are user-controlled, so they
      # are never interpolated into the script with ${{ }}. jq reads them from
      # the event payload file and builds the JSON itself, which keeps any
      # backticks, quotes or $(...) in them from being run by the shell.
      - name: Build Discord payload
        run: |
          jq --arg event "$GITHUB_EVENT_NAME" --arg repo "$GITHUB_REPOSITORY" '
            def link($text; $url): "[\($text)](\($url))";
            def strip: (. // "") | sub("\\A\\s+"; "") | sub("\\s+\\z"; "");
            def truncate($n): if length > $n then .[0:$n] + "..." else . end;

            . as $e
            | (if $event == "issue_comment" then $e.issue else $e.pull_request end) as $pr
            | (if $event == "pull_request" then
                 if $e.action == "opened" then {title: "🆕 New Pull Request", color: 3066993}
                 elif $e.action == "synchronize" then {title: "🔄 Pull Request Updated", color: 15844367}
                 elif $e.action == "reopened" then {title: "🔓 Pull Request Reopened", color: 15844367}
                 elif $pr.merged then {title: "✅ Pull Request Merged", color: 5763719}
                 else {title: "❌ Pull Request Closed", color: 15158332}
                 end
               elif $event == "pull_request_review" then
                 if $e.review.state == "approved" then {title: "✅ Pull Request Approved", color: 5763719}
                 elif $e.review.state == "changes_requested" then {title: "🔄 Changes Requested", color: 15158332}
                 else {title: "💬 Pull Request Reviewed", color: 7506394}
                 end
               elif $event == "pull_request_review_comment" then {title: "💬 Review Comment Added", color: 7506394}
               else {title: "💬 Comment Added", color: 7506394}
               end) as $kind
            | (if $event == "pull_request" then
                 {label: "Description", body: $pr.body, at: $pr.updated_at}
               elif $event == "pull_request_review" then
                 {label: "Review Comment", body: $e.review.body, at: $e.review.submitted_at,
                  actor_label: "Reviewer", actor: $e.review.user}
               else
                 {label: "Comment", body: $e.comment.body, at: $e.comment.updated_at,
                  actor_label: "Commenter", actor: $e.comment.user}
               end) as $src
            | ($src.body | strip | truncate(300)) as $body
            | {
                embeds: [{
                  title: $kind.title,
                  description: "**\(link($pr.title; $pr.html_url))**",
                  color: $kind.color,
                  fields: (
                    [
                      {name: "Repository", value: link($repo; "https://github.com/\($repo)"), inline: true},
                      {name: "Author", value: link($pr.user.login; $pr.user.html_url), inline: true}
                    ]
                    + (if $event == "pull_request" then [
                         {name: "Branch", value: "`\($pr.head.ref)` → `\($pr.base.ref)`", inline: false},
                         {name: "Changes", value: "+\($pr.additions) -\($pr.deletions) (\($pr.commits) commit\(if $pr.commits == 1 then "" else "s" end))", inline: true},
                         {name: "Files Changed", value: "\($pr.changed_files)", inline: true}
                       ] else [
                         {name: $src.actor_label, value: link($src.actor.login; $src.actor.html_url), inline: true},
                         {name: "PR Number", value: "#\($pr.number)", inline: true}
                       ] end)
                    + (if $body == "" then [] else [{name: $src.label, value: $body, inline: false}] end)
                  ),
                  timestamp: ($src.at // (now | todate)),
                  footer: {
                    text: "GitHub",
                    icon_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
                  }
                }]
              }
          ' "$GITHUB_EVENT_PATH" > discord_payload.json

          cat discord_payload.json

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Check if webhook URL is set
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "⚠️ DISCORD_WEBHOOK_URL secret is not set. Skipping notification."
            exit 0
          fi

          # --fail-with-body fails the step if Discord rejects the payload, and
          # --retry covers rate limiting (429) and transient 5xx responses.
          curl --fail-with-body --silent --show-error --retry 3 \
               -H "Content-Type: application/json" \
               --data-binary @discord_payload.json \
               "$DISCORD_WEBHOOK"

          echo "✅ Discord notification sent successfully!"
